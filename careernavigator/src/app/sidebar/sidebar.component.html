<nav class="sidebar"
     role="navigation"
     aria-label="Dashboard main navigation">
  <button class="sidebar-toggle"
          aria-label="Toggle navigation menu"
          aria-controls="sidebar-navigation-list"
          aria-expanded="false"
          (click)="toggleSidebar()"
          tabindex="0">
    <!-- Simple hamburger icon (SVG) -->
    <svg width="28" height="28" focusable="false" aria-hidden="true" viewBox="0 0 24 24"><rect y="4" width="24" height="2" rx="1"/><rect y="11" width="24" height="2" rx="1"/><rect y="18" width="24" height="2" rx="1"/></svg>
  </button>
  <ul id="sidebar-navigation-list"
      [class.collapsed]="collapsed"
      tabindex="0">
    <li>
      <a routerLink="/home" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         aria-label="Home"
         tabindex="0">
        <!-- Home Icon -->
        <span class="sidebar-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" d="M10 3.1L2 9.44V18h5v-4h6v4h5V9.44z"/></svg>
        </span>
        <span class="sidebar-link-text">Home</span>
      </a>
    </li>
    <li>
      <a routerLink="/recommendations" routerLinkActive="active"
         aria-label="Recommendations"
         tabindex="0">
        <!-- Recommendation Icon -->
        <span class="sidebar-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" d="M10 2C5.59 2 2 5.58 2 10s3.59 8 8 8 8-3.58 8-8-3.59-8-8-8zm0 14c-3.32 0-6-2.68-6-6 0-3.31 2.68-6 6-6 3.31 0 6 2.69 6 6 0 3.32-2.69 6-6 6zm-1-9h2v5h-2zm1 8c-.55 0-1-.45-1-1h2c0 .55-.45 1-1 1z"/></svg>
        </span>
        <span class="sidebar-link-text">Recommendations</span>
      </a>
    </li>
    <li>
      <a routerLink="/statistics" routerLinkActive="active"
         aria-label="Statistics"
         tabindex="0">
        <!-- Statistics Icon -->
        <span class="sidebar-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" d="M4 16h12v2H4zm2-8h2v6H6zm8-4h2v10h-2zm-4 3h2v7h-2z"/></svg>
        </span>
        <span class="sidebar-link-text">Statistics</span>
      </a>
    </li>
    <li>
      <a routerLink="/jobs" routerLinkActive="active"
         aria-label="Jobs"
         tabindex="0">
        <!-- Jobs Icon -->
        <span class="sidebar-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" d="M4 7V5a4 4 0 0 1 8 0v2h4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm2-2a2 2 0 0 1 4 0v2H6zm12 7v-3H2v3z"/></svg>
        </span>
        <span class="sidebar-link-text">Jobs</span>
      </a>
    </li>
    <li>
      <a routerLink="/profile" routerLinkActive="active"
         aria-label="Profile"
         tabindex="0">
        <!-- Profile/User Icon -->
        <span class="sidebar-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" d="M10 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z"/></svg>
        </span>
        <span class="sidebar-link-text">Profile</span>
      </a>
    </li>
  </ul>
</nav>
